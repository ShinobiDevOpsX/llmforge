global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: llmforge

rule_files:
  - /etc/prometheus/rules/*.yml

# No Alertmanager is deployed in the MVP; firing alerts are visible at
# http://localhost:9090/alerts. Add an `alerting:` block to route them.

scrape_configs:
  - job_name: llmforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["llmforge-api:8000"]
        labels:
          service: llmforge-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
